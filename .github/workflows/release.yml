name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (skip publishing)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'your-github-username' # TODO: 替换为你的GitHub用户名或组织名
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify environment
        run: ./gradlew --version

      - name: Build
        run: ./gradlew build test --no-daemon

      - name: Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 22
          branches: |
            [
              '+main'
            ]
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot@users.noreply.github.com

  build-artifacts:
    needs: release
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build --no-daemon

      - name: Set version variables
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Prepare mod artifact
        run: |
          cd mod/build/libs
          rm -f *-sources.jar *-all.jar *-dev.jar *-javadoc.jar
          JAR=$(ls *.jar 2>/dev/null | grep -v sources | grep -v all | grep -v dev | head -1)
          if [ -n "$JAR" ]; then
            for f in *.jar; do [ "$f" != "$JAR" ] && rm -f "$f"; done
            mv "$JAR" "packweaver-mod-${VERSION:-latest}.jar"
          fi

      - name: Prepare plugin artifact
        run: |
          cd plugin/build/libs
          rm -f *-sources.jar *-all.jar *-dev.jar *-javadoc.jar
          JAR=$(ls *.jar 2>/dev/null | grep -v sources | grep -v all | grep -v dev | head -1)
          if [ -n "$JAR" ]; then
            for f in *.jar; do [ "$f" != "$JAR" ] && rm -f "$f"; done
            mv "$JAR" "packweaver-plugin-${VERSION:-latest}.jar"
          fi

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mod/build/libs/packweaver-mod-*.jar
            plugin/build/libs/packweaver-plugin-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
