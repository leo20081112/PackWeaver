# PackWeaver Sync 配置
# 桥接端口（默认只监听 127.0.0.1 回环，外网不可访问）
tcp-port: 32005
http-port: 32006
# 监听地址：127.0.0.1 仅本机；0.0.0.0 允许局域网/远程（务必同时设置 auth-token）
bind-address: '127.0.0.1'
# 鉴权令牌（留空 = 不鉴权）。设置后所有 /pw 端点需携带请求头 X-PW-Token
auth-token: ''
# 单次部署数据包的体积上限（MB），防止异常请求占满内存
max-deploy-mb: 64
# 每个命名空间保留的部署备份数（同名重复部署时旧包自动备份）
backups-keep: 10
