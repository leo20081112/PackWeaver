name: PackWeaverSync
version: '1.0.0'
main: dev.packweaver.sync.PackWeaverSyncPlugin
api-version: '1.20'
description: 'PackWeaver 服务端同步插件：HTTP/TCP 桥接，部署数据包并热重载（规划书第 19/20 章）'
author: leo20081112
website: https://github.com/leo20081112/PackWeaver
commands:
  pws:
    description: PackWeaver 同步插件命令
    usage: /pws <reload|stats|bridge>
    permission: packweaver.sync
permissions:
  packweaver.sync:
    description: 使用 PackWeaver 同步插件命令
    default: op
