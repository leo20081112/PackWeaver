name: DatapackEditor
version: '${version}'
main: com.dpe.server.DatapackEditorPlugin
api-version: '1.21'
author: dpe
description: In-game datapack editor for Paper servers.
commands:
  datapackeditor:
    description: Manage and edit datapacks in-game.
    aliases: [dpe]
    usage: /datapackeditor [help|chat|add <schemaId>|list|compile|reload|<namespace>]
    permission: dpe.use
permissions:
  dpe.use:
    description: Allows use of the DatapackEditor commands.
    default: op
