name: PackWeaver
version: '${version}'
main: com.dpe.server.DatapackEditorPlugin
api-version: '1.21'
author: PackWeaver
description: PackWeaver - In-Game Datapack Studio. Block editor, IDE mode, autocomplete, vanilla manual, templates, one-key reload for Paper servers.
commands:
  datapackeditor:
    description: Manage and edit datapacks in-game with PackWeaver.
    aliases: [dpe, packweaver, pw]
    usage: /dpe [help|chat|add <schemaId>|list|compile|reload|wiki [keyword] [page]|template [list|<id>]|folder [namespace]|<namespace>]
    permission: dpe.use
permissions:
  dpe.use:
    description: Allows use of the PackWeaver commands.
    default: op
